# Every 15 minutes: scripts/auto.mjs runs the full build when one is due (every
# 3 hours) and otherwise the light live check, which does nothing when no event
# is on. Pushes to main and manual runs (mode "full") always do the full build.
#
# GitHub's own schedule proved unreliable (it never started for this repo), so an
# outside cron service (cron-job.org) also starts this workflow every 15 minutes
# through the API with mode "auto". See "Outside trigger" in CLAUDE.md.
# Everything runs in this one workflow, so two runs never write the data at once.
name: Update and publish

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = fetch everything now; auto = full only when due, otherwise the quick live check'
        type: choice
        options: [full, auto]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.save.outputs.changed == 'true' || steps.mode.outputs.mode == 'full' }}
    steps:
      - name: Pick the mode
        id: mode
        run: echo "mode=${{ github.event_name == 'schedule' && 'auto' || (github.event_name == 'workflow_dispatch' && inputs.mode) || 'full' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests (code only; the data is checked after the update)
        run: node --test test/scoring.test.mjs test/logic.test.mjs

      - name: Fetch and score events
        run: node scripts/auto.mjs
        env:
          FULL: ${{ steps.mode.outputs.mode == 'full' && '1' || '0' }}

      - name: Check the data is spoiler-free
        run: npm test

      - name: Save the new data
        id: save
        run: |
          git config user.name "primetime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json docs/data/reasons.json docs/data/results.json data/state.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update events"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version the page's files (stops browsers mixing old and new files)
        if: steps.save.outputs.changed == 'true' || steps.mode.outputs.mode == 'full'
        run: node scripts/stamp.mjs "${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v5
        if: steps.save.outputs.changed == 'true' || steps.mode.outputs.mode == 'full'
        with:
          path: docs

  # Publish only when the data or the code changed.
  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
